# Local setup, for development and testing. Ports are published on localhost only, so the database and
# models are not reachable from the network. The cloud setup is in deploy/azure.
services:
  db:
    # Postgres 17 with pgvector (vector index for semantic search).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bookfinder
      POSTGRES_PASSWORD: bookfinder
      POSTGRES_DB: bookfinder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1g
    # Tuned for bulk loading on a dev machine.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=30min
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookfinder -d bookfinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    # Serves the EmbeddingGemma model used for semantic search; the model is built into the image.
    # Runs on CPU; to use an NVIDIA GPU, add a `deploy.resources.reservations.devices` entry.
    build: ./deploy/ollama
    ports:
      - "127.0.0.1:11434:11434"

  reranker:
    # Re-orders the best search candidates with a cross-encoder that reads the query and each book
    # together (gte-reranker-modernbert-base, 149M). Served by Hugging Face Text Embeddings Inference
    # on CPU; the model is built into the image.
    build: ./deploy/reranker
    ports:
      - "127.0.0.1:8081:80"

  api:
    # GET /search on http://localhost:8080. Needs the catalogue loaded and the vectors computed.
    build: .
    environment:
      DATABASE_URL: postgres://bookfinder:bookfinder@db:5432/bookfinder?sslmode=disable
      OLLAMA_URL: http://ollama:11434
      RERANKER_URL: http://reranker:80
      # With a Voyage AI key in .env (VOYAGE_API_KEY=...), the api re-ranks with Voyage instead of the
      # reranker service, like on Azure. VOYAGE_MODEL picks the model (default rerank-3).
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      reranker:
        condition: service_started

  web:
    # The search page on http://localhost:3000; nginx forwards /search to the api service.
    build: ./web
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - api

volumes:
  pgdata:
