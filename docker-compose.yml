services:
  db:
    # Postgres 17 with pgvector (vector index for semantic search).
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: bookfinder
      POSTGRES_PASSWORD: bookfinder
      POSTGRES_DB: bookfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 1g
    # Tuned for bulk loading on a dev machine.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=30min
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookfinder -d bookfinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    # Serves the EmbeddingGemma model used for semantic search. Pull it once with
    # `docker compose exec ollama ollama pull embeddinggemma`; the model is kept in the ollama volume.
    # Runs on CPU; to use an NVIDIA GPU, add a `deploy.resources.reservations.devices` entry.
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  reranker:
    # Re-orders the best search candidates with a cross-encoder that reads the query and each book
    # together (gte-reranker-modernbert-base, 149M). Served by Hugging Face Text Embeddings Inference
    # on CPU; the model is downloaded on first start and kept in the reranker volume.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "Alibaba-NLP/gte-reranker-modernbert-base", "--max-client-batch-size", "100"]
    ports:
      - "8081:80"
    volumes:
      - reranker:/data

  api:
    # GET /search on http://localhost:8080. Needs the catalogue loaded and the vectors computed.
    build: .
    environment:
      DATABASE_URL: postgres://bookfinder:bookfinder@db:5432/bookfinder?sslmode=disable
      OLLAMA_URL: http://ollama:11434
      RERANKER_URL: http://reranker:80
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      reranker:
        condition: service_started

volumes:
  pgdata:
  ollama:
  reranker:
