name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bookfinder
          POSTGRES_PASSWORD: bookfinder
          POSTGRES_DB: bookfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookfinder -d bookfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BOOKFINDER_TEST_DATABASE_URL: postgres://bookfinder:bookfinder@localhost:5432/bookfinder?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -p 1: database tests in different packages share one database.
      - run: go test -race -p 1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Type-checks, then builds.
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the API image
        run: docker build -t book-finder-api .
